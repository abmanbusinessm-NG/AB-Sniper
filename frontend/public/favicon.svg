<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">AB Sniper</title>
  <desc id="desc">A bold AB monogram inside a precision targeting reticle.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="0.52" stop-color="#D9A441"/>
      <stop offset="1" stop-color="#A96C16"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded-square favicon background -->
  <rect width="512" height="512" rx="112" fill="#0B1018"/>

  <!-- Precision reticle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#gold)" stroke-width="10"/>
  <circle cx="256" cy="256" r="166" fill="none" stroke="#D9A441" stroke-opacity=".22" stroke-width="2"/>
  <path d="M256 35v54 M256 423v54 M35 256h54 M423 256h54"
        stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
  <path d="M103 103l38 38 M371 371l38 38 M409 103l-38 38 M141 371l-38 38"
        stroke="#D9A441" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/>

  <!-- AB monogram -->
  <path d="M130 345l76-190h42l76 190h-48l-15-42h-70l-16 42h-45zm75-80h43l-21-59-22 59z"
        fill="#F4F6FA"/>
  <path d="M303 155h65c48 0 75 23 75 62 0 23-11 40-30 49 26 8 40 28 40 56 0 46-32 73-84 73h-66V155zm45 38v57h17c23 0 35-10 35-29 0-18-12-28-35-28h-17zm0 93v70h20c26 0 39-12 39-35 0-23-13-35-39-35h-20z"
        fill="url(#gold)" transform="translate(-45 0) scale(.9 1) translate(28 0)"/>
  <!-- Small center targeting mark -->
  <circle cx="256" cy="256" r="5" fill="#0B1018" stroke="#F4F6FA" stroke-width="2"/>
</svg>